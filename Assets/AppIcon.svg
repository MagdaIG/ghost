<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ghost app icon · diseño original · MIT -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c303c"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <radialGradient id="aura" cx="512" cy="470" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd3e4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <path id="ghost" d="M 322 528 C 322 398 406 296 512 296 C 618 296 702 398 702 528 L 702 748
      A 63.33 44 0 0 1 575.33 748 A 63.33 44 0 0 1 448.67 748 A 63.33 44 0 0 1 322 748 Z"/>
  </defs>

  <!-- Fondo -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#aura)"/>
    <circle cx="262" cy="270" r="5" fill="#ffffff" opacity="0.55"/>
    <circle cx="790" cy="318" r="4" fill="#ffffff" opacity="0.45"/>
    <circle cx="742" cy="214" r="3" fill="#ffffff" opacity="0.35"/>
    <circle cx="214" cy="430" r="3" fill="#ffffff" opacity="0.30"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- Sombra y halo -->
  <ellipse cx="512" cy="836" rx="150" ry="16" fill="#000000" opacity="0.55" filter="url(#soft)"/>
  <use href="#ghost" fill="#a9b6ff" opacity="0.35" filter="url(#glow)"/>

  <!-- Fantasma -->
  <use href="#ghost" fill="url(#body)"/>

  <!-- Ojos cerrados: el Mac duerme la pantalla, pero sigue vivo -->
  <g fill="none" stroke="#1b1e27" stroke-width="18" stroke-linecap="round">
    <path d="M 420 520 Q 450 550 480 520"/>
    <path d="M 544 520 Q 574 550 604 520"/>
  </g>
  <g fill="#ff9fb3" opacity="0.35">
    <ellipse cx="418" cy="582" rx="24" ry="13"/>
    <ellipse cx="606" cy="582" rx="24" ry="13"/>
  </g>
</svg>
